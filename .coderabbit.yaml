# CodeRabbit config — free AI PR reviews for open source.
# Install the CodeRabbit GitHub App on the repo for this to take effect:
#   https://github.com/apps/coderabbitai
# Docs: https://docs.coderabbit.ai/guides/configure-coderabbit
language: en-US

reviews:
  profile: chill            # concise, non-nitpicky reviews
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
  # opendot's moat is that `undo` never lies. Review changes to the
  # reversibility engine and any filesystem-mutating tool with extra care.
  path_instructions:
    - path: "src/opendot/reversibility/**"
      instructions: >
        This is opendot's reversibility engine — the core guarantee is that
        every mutating action is snapshotted first and `undo` restores exact
        prior bytes. Flag anything that could make undo incomplete or incorrect,
        any mutation that isn't snapshotted, or any action that escapes the
        workspace without being marked irreversible / gated by confirmation.
    - path: "src/opendot/tools/**"
      instructions: >
        Tools act on the user's real filesystem/shell. Any tool that mutates
        state must snapshot via the reversibility engine before doing so, and
        must not silently perform effects that leave the workspace.

chat:
  auto_reply: true
