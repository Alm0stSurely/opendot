name: Release

# Publish to PyPI when you push a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# Uses PyPI Trusted Publishing (OIDC) — no API token stored in GitHub.
# One-time setup on PyPI: project → Publishing → add a trusted publisher for
# this repo + workflow file `release.yml` + environment `pypi`.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        run: |
          # Tag is like refs/tags/v0.0.2 -> strip to 0.0.2
          TAG="${GITHUB_REF_NAME#v}"
          # Read version from pyproject.toml (grep the [project] version line)
          PKG=$(grep -E '^\s*version\s*=' pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=$TAG  pyproject version=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match pyproject.toml version $PKG."
            echo "::error::Bump 'version' in pyproject.toml (and src/opendot/__init__.py) to $TAG, commit, then re-tag."
            exit 1
          fi
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check artifacts
        run: |
          pip install twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi          # PyPI trusted-publisher environment
    permissions:
      id-token: write          # required for OIDC (Trusted Publishing)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
